name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare environment configuration
        run: |
          # Create .env from .env.example or GitHub Secret if not present
          if [ ! -f .env ]; then
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease -x validateSigningRelease --no-daemon --stacktrace || true

      - name: Upload Release APK Artifact (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
