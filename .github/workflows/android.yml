name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Verify and Repair Gradle Wrapper
        run: |
          chmod +x gradlew
          # Test if the wrapper jar is intact
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Corrupt or invalid gradle-wrapper.jar detected. Rebuilding wrapper with Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          else
            echo "gradle-wrapper.jar verified successfully."
          fi

      - name: Prepare environment configuration
        run: |
          # Create .env from .env.example or GitHub Secret if not present
          if [ ! -f .env ]; then
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env
            fi
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ] && jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK (Unsigned)
        run: |
          if [ -x "./gradlew" ] && jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            ./gradlew assembleRelease -x validateSigningRelease --no-daemon --stacktrace || true
          else
            gradle assembleRelease -x validateSigningRelease --no-daemon --stacktrace || true
          fi

      - name: Upload Release APK Artifact (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
